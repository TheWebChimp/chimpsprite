[package]
name = "chimpsprite-thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thumbnails of .chimp files in the system file manager (Windows shell extension)"

# `cdylib`: `chimpsprite_thumbnails.dll` (Windows) para `regsvr32`; `rlib`: los tests.
# Ver docs/thumbnails.md.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cs-io.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"

[dev-dependencies]
cs-core.workspace = true
cs-commands.workspace = true
