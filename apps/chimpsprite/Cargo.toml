[package]
name = "chimpsprite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-ui.workspace = true
# `links`: abrir enlaces en el navegador (Pixnews, Lospec…); sin ella, `open_url` no hace nada.
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11", "links"] }
log.workspace = true

[build-dependencies]
# El ícono adentro del `.exe` en Windows (usa el rc.exe del SDK).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Los íconos de la ventana desde los recursos del `.exe` (ver src/win_icon.rs).
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# Respaldo WebGL2 para navegadores sin WebGPU (se unifica con el wgpu de eframe).
wgpu = { version = "30", default-features = false, features = ["webgl"] }
