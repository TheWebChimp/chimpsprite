<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChimpSprite</title>
    <link data-trunk rel="icon" href="../../assets/icon/icon-32.png">
    <link data-trunk rel="copy-file" href="../../assets/icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
    <meta name="description" content="Open-source sprite and pixel-art editor written in pure Rust.">
    <link data-trunk rel="rust" data-bin="chimpsprite" data-wasm-opt="z">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1c22;
            color: #e6e6ea;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #chimpsprite {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            padding: 24px;
        }
        #loading .title {
            font-size: 22px;
            font-weight: 600;
            color: #f28c28;
        }
        #loading .spinner {
            width: 28px;
            height: 28px;
            margin: 12px;
            border: 3px solid #33343e;
            border-top-color: #f28c28;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="chimpsprite"></canvas>
    <div id="loading">
        <div class="title">ChimpSprite</div>
        <div class="spinner"></div>
        <p>Loading…</p>
        <noscript><p>ChimpSprite needs JavaScript and WebAssembly.</p></noscript>
    </div>
</body>
</html>
