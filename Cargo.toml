[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheWebChimp/chimpsprite"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
proptest = "1.12"
png = "0.18"
eframe = { version = "0.36", default-features = false }
env_logger = "0.11"
cs-core = { path = "crates/cs-core" }
cs-raster = { path = "crates/cs-raster" }
cs-commands = { path = "crates/cs-commands" }
cs-render = { path = "crates/cs-render" }
cs-tools = { path = "crates/cs-tools" }
cs-io = { path = "crates/cs-io" }
cs-ui = { path = "crates/cs-ui" }
cs-agent = { path = "crates/cs-agent" }
cs-script = { path = "crates/cs-script" }
