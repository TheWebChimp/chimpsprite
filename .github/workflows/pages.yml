name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          base="https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}"
          curl -sSfLO "$base/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLO "$base/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256"
          # El .sha256 de trunk trae solo el hash; sha256sum espera "hash  archivo".
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          sudo tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin
          trunk --version
      - name: Build
        working-directory: apps/chimpsprite
        run: trunk build --release --public-url /chimpsprite/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/chimpsprite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
