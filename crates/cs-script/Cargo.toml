[package]
name = "cs-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core.workspace = true
cs-agent.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rhai = { version = "1", features = ["serde"] }

# Lua (5.4, compilado desde sus fuentes) solo en escritorio: en la web no hay compilador de C.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1", features = ["serde", "wasm-bindgen"] }
