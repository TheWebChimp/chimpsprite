[package]
name = "cs-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core.workspace = true
cs-commands.workspace = true
cs-render.workspace = true
flate2 = "1.1"
base64 = "0.22"
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate"] }
png.workspace = true
gif = "0.14"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
log.workspace = true
# Leer TTF/OTF (importar fuentes y probar las exportadas); la misma versión que usa fontdue.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[dev-dependencies]
# La que usa la herramienta Texto: las fuentes exportadas se prueban con ella.
fontdue = "0.9"
# Fuentes reales (no pixel) para probar el importador.
epaint_default_fonts = "0.36"
cs-raster.workspace = true
proptest.workspace = true
