[package]
name = "cs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core.workspace = true
cs-3d.workspace = true
cs-raster.workspace = true
cs-commands.workspace = true
cs-render.workspace = true
cs-tools.workspace = true
cs-io.workspace = true
cs-script.workspace = true
thiserror.workspace = true
rfd = "0.17"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
png.workspace = true
log.workspace = true
ehttp = "0.7"
# Para saber qué glifos tiene la fuente pixel (la misma versión que usa cs-tools).
fontdue = "0.9"
# Formas responsivas (flexbox / grid de taffy) para los paneles: solo las usa `forms`. Versión
# fija: es la que pide egui 0.36.
egui_taffy = "=0.14.0"
# El acomodo de los paneles (acoplar, pestañas, flotantes): solo lo usa `workspace`. Versión fija:
# la piel depende de detalles internos suyos (dos ids y cómo pinta; ver `workspace/skin.rs`).
egui_dock = { version = "=0.21.1", features = ["serde"] }

# Imágenes copiadas en otras apps (mismas features que usa egui-winit: no compila nada extra).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Las miniaturas de Pixnews (JPEG, PNG y GIF; ya entra con arboard) y las imágenes de Groom
# (también WebP).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Los zips de las fuentes de dafont (la misma versión que usa cs-io).
zip = { version = "9", default-features = false, features = ["deflate"] }
# Los sonidos de la interfaz (los MP3 de UI SFX).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "Url",
    "Storage",
    "Location",
    "BeforeUnloadEvent",
    "HtmlAudioElement",
    "HtmlMediaElement",
] }

[dev-dependencies]
# Para decodificar los GIF de GIF settings en los tests (la misma versión que usa cs-io).
gif = "0.14"
