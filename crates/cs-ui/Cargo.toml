[package]
name = "cs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core.workspace = true
cs-raster.workspace = true
cs-commands.workspace = true
cs-render.workspace = true
cs-tools.workspace = true
cs-io.workspace = true
thiserror.workspace = true
rfd = "0.17"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
png.workspace = true
log.workspace = true
ehttp = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "Url",
    "Storage",
    "Location",
    "BeforeUnloadEvent",
] }
