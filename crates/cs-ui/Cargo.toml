[package]
name = "cs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core.workspace = true
cs-raster.workspace = true
cs-commands.workspace = true
cs-render.workspace = true
cs-tools.workspace = true
cs-io.workspace = true
thiserror.workspace = true
rfd = "0.17"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
png.workspace = true
log.workspace = true
ehttp = "0.7"
# Para saber qué glifos tiene la fuente pixel (la misma versión que usa cs-tools).
fontdue = "0.9"

# Imágenes copiadas en otras apps (mismas features que usa egui-winit: no compila nada extra).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Las miniaturas del feed de Reddit (JPEG y PNG); ya entra con arboard.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "Url",
    "Storage",
    "Location",
    "BeforeUnloadEvent",
] }
